name: promote_staging_to_prod

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate staging health
        run: |
          curl -f "https://${{ secrets.AZURE_APP_NAME }}-staging.azurewebsites.net/health" || exit 1

      - name: Swap staging into production
        run: |
          az webapp deployment slot swap \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_APP_NAME }} \
            --slot staging \
            --target-slot production

      - name: Confirm production swap
        run: |
          echo "Staging was successfully swapped into production."
          echo "Validate the production endpoint: https://${{ secrets.AZURE_APP_NAME }}.azurewebsites.net/health"
