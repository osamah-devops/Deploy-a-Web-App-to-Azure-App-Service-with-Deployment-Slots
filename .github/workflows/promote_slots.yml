name: promote_slots

on:
  workflow_dispatch:

jobs:
  validate_dev_slot:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate dev slot health
        run: |
          curl -f "https://${{ secrets.AZURE_APP_NAME }}-dev.azurewebsites.net/health" || exit 1

  wait_for_staging_approval:
    needs: validate_dev_slot
    runs-on: ubuntu-latest
    environment:
      name: staging-approval
    steps:
      - name: Waiting for staging approval
        run: echo "Approval for dev -> staging has been granted."

  swap_dev_to_staging:
    needs: wait_for_staging_approval
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Swap dev into staging
        run: |
          az webapp deployment slot swap \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_APP_NAME }} \
            --slot dev \
            --target-slot staging

  validate_staging_slot:
    needs: swap_dev_to_staging
    runs-on: ubuntu-latest
    steps:
      - name: Validate staging health
        run: |
          curl -f "https://${{ secrets.AZURE_APP_NAME }}-staging.azurewebsites.net/health" || exit 1

  wait_for_production_approval:
    needs: validate_staging_slot
    runs-on: ubuntu-latest
    environment:
      name: production-approval
    steps:
      - name: Waiting for production approval
        run: echo "Approval for staging -> production has been granted."

  swap_staging_to_production:
    needs: wait_for_production_approval
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Swap staging into production
        run: |
          az webapp deployment slot swap \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_APP_NAME }} \
            --slot staging \
            --target-slot production

      - name: Final confirmation
        run: |
          echo "Staging was successfully swapped into production."
          echo "Validate production: https://${{ secrets.AZURE_APP_NAME }}.azurewebsites.net/health"
